<div className="logo-container">
  <svg
    className="logo-svg"
    viewBox="0 0 200 80"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>
      <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stopColor="#8B5CF6" />
        <stop offset="50%" stopColor="#7E22CE" />
        <stop offset="100%" stopColor="#06B6D4" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="3" stdDeviation="3" floodColor="#000000" floodOpacity="0.3"/>
      </filter>
    </defs>

    {/* Символ звезды/созвездия */}
    <g filter="url(#shadow)">
      <polygon points="25,40 15,50 25,60 35,50" fill="url(#modernGradient)" stroke="white" strokeWidth="2"/>
      <circle cx="25" cy="40" r="3" fill="white"/>
      <circle cx="15" cy="50" r="2" fill="white"/>
      <circle cx="25" cy="60" r="2" fill="white"/>
      <circle cx="35" cy="50" r="2" fill="white"/>
    </g>

    {/* Текст */}
    <text x="60" y="35" textAnchor="start" fill="white" fontSize="20" fontWeight="800" fontFamily="'Segoe UI', Arial, sans-serif">
      СИРИУС
    </text>
    <text x="60" y="55" textAnchor="start" fill="white" fontSize="16" fontWeight="600" fontFamily="'Segoe UI', Arial, sans-serif" opacity="0.95">
      ЛЕТО 2025
    </text>
  </svg>
</div>